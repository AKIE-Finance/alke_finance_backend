name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # OIDC to AWS for the deploy job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, schema, migrations, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alke
          POSTGRES_PASSWORD: alke
          POSTGRES_DB: alke_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alke -d alke_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://alke:alke@localhost:5432/alke_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://alke:alke@localhost:5432/alke_ci_shadow?schema=public
      JWT_SECRET: ci-only-secret-never-used-outside-github-actions-0123456789
      # Mirrors .env.test (git-ignored): the suite relies on the demo OTP and simulated connectors.
      OTP_DEMO_MODE: 'true'
      OTP_DEMO_CODE: '123456'
      JWT_EXPIRES_IN: 15m
      PAYMENTS_MODE: simulated
      SDB_CONNECTOR: simulated
      KYC_MODE: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma schema is valid
        run: pnpm prisma validate
      - run: pnpm prisma generate
      - name: TypeScript compiles
        run: npx tsc --noEmit -p tsconfig.json
      - name: Migrations apply to a clean database
        run: pnpm prisma migrate deploy
      - name: Schema and migrations do not drift
        run: |
          psql "postgresql://alke:alke@localhost:5432/postgres" -c 'CREATE DATABASE alke_ci_shadow'
          pnpm prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - name: Seed runs against the migrated database
        env:
          ADMIN_SEED_EMAIL: ci-admin@example.test
          ADMIN_SEED_PASSWORD: CiOnlyPassword!2026
        run: pnpm seed
      - name: Unit tests
        run: pnpm test
      - name: Production dependency audit (high and above)
        run: pnpm audit --prod --audit-level high || echo "::warning::pnpm audit reported findings; see log"

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: alke-api:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging (main only)
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'af-south-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'alke-staging-api' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'alke-staging' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'alke-staging-api' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run migrations as a one-off task
        run: |
          TASK_DEF=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          NETWORK=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].networkConfiguration' --output json)
          TASK_ARN=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$TASK_DEF" \
            --network-configuration "$NETWORK" \
            --overrides '{"containerOverrides":[{"name":"api","environment":[{"name":"RUN_MIGRATIONS","value":"true"},{"name":"MIGRATE_ONLY","value":"true"}]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT" = "0"
      - name: Roll the service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
