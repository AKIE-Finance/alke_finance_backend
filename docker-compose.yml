services:
  postgres:
    image: postgres:16-alpine
    container_name: alke_finance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alke
      POSTGRES_PASSWORD: alke_dev_local_only
      POSTGRES_DB: alke_finance_dev
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "55432:5432"
    volumes:
      - alke_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alke -d alke_finance_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alke_finance_redis
    restart: unless-stopped
    ports:
      - "55380:6379"
    volumes:
      - alke_redis_data:/data

volumes:
  alke_pg_data:
  alke_redis_data:
