# Local development stack. Ports are deliberately non-default (55432 / 55380)
# because this machine runs other PostgreSQL instances on 5432/5433.
# `docker compose up -d` starts the databases only; add `--profile api` to also
# run the API from the production Dockerfile (migrations + seed on first start).
services:
  postgres:
    image: postgres:16-alpine
    container_name: alke_finance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alke
      POSTGRES_PASSWORD: alke_dev_local_only
      POSTGRES_DB: alke_finance_dev
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "55432:5432"
    volumes:
      - alke_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alke -d alke_finance_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alke_finance_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "55380:6379"
    volumes:
      - alke_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: .
      args:
        APP_VERSION: local
    container_name: alke_finance_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://alke:alke_dev_local_only@postgres:5432/alke_finance_dev?schema=public
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    ports:
      - "3000:3000"

volumes:
  alke_pg_data:
  alke_redis_data:
